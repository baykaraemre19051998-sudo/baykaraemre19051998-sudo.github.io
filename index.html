<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenses Işıl Moral Merkezi 👑</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #f8bbd0 100%);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .castle-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border: 3px solid #f4c430;
            border-radius: 28px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.18), 0 0 20px rgba(244, 196, 48, 0.25);
            position: relative;
            z-index: 2;
        }

        .crown {
            font-size: 54px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(244, 196, 48, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            color: #be185d;
            font-size: 22px;
            margin: 12px 0 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #d97706;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
        }

        .message-box {
            background: #fff5f8;
            border: 1.5px dashed #f472b6;
            border-radius: 18px;
            padding: 22px 18px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            transition: all 0.3s ease;
        }

        #mesaj {
            font-size: 17px;
            line-height: 1.55;
            color: #831843;
            font-weight: 600;
            transition: opacity 0.25s ease;
        }

        .royal-btn {
            background: linear-gradient(45deg, #ec4899, #db2777);
            color: #ffffff;
            border: 2px solid #fde047;
            padding: 15px 28px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .royal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(219, 39, 119, 0.45);
        }

        .royal-btn:active {
            transform: scale(0.96);
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: fly 1.4s ease-out forwards;
            z-index: 10;
        }

        @keyframes fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <div class="castle-card">
        <div class="crown">👑</div>
        <h1>Prenses Işıl Moral Fermanı</h1>
        <div class="subtitle">✦ Işıl Hazretleri'ne Özel Protokol ✦</div>
        
        <div class="message-box">
            <p id="mesaj">Işıl Hazretleri'nin modu biraz düşmüş diye duyduk... Acil durum ışıltısı için butona dokunun! ✨</p>
        </div>

        <button class="royal-btn" onclick="prensesMorali(event)">✨ Kraliyet Dozu Al ✨</button>
    </div>

    <script>
        const mesajlar = [
            "Tacın biraz eğilmiş olabilir Işıl ama unutma: Bu krallığın en parlak ışığı hâlâ sensin. 👑",
            "Saray kuralları gereği Işıl'ın bugün üzülmesi kesinlikle yasaklanmıştır. Aksini iddia eden zindana atılır! 🏰",
            "Adın gibi etrafındaki herkese ışık saçıyorsun Işıl, bugün sadece dinlenme molası ver. ✨",
            "Bazen en güçlü prenseslerin bile ejderhalarla savaşmaya ara verip kahve içmeye ihtiyacı olur Işıl. ☕💖",
            "Gülüşün krallık hazinesinden bile daha değerli Işıl, kimsenin o ışıltıyı çalmasına izin verme. 💎",
            "Bugün dünyayı kurtarmak yok Işıl; sadece derin bir nefes al, tacını düzelt ve keyfine bak. 🌸",
            "Bu sayfa özel olarak Işıl'ın yüzünde minicik bir tebessüm oluşsun diye kodlandı. Başardı mı? 🪄"
        ];

        let sonIndex = -1;

        function prensesMorali(e) {
            const mesajEl = document.getElementById("mesaj");
            let rastgele;
            do {
                rastgele = Math.floor(Math.random() * mesajlar.length);
            } while (rastgele === sonIndex);
            sonIndex = rastgele;

            mesajEl.style.opacity = 0;
            setTimeout(() => {
                mesajEl.innerText = mesajlar[rastgele];
                mesajEl.style.opacity = 1;
            }, 150);

            pariltiSac(e);
        }

        function pariltiSac(e) {
            const ikonlar = ["✨", "💖", "👑", "🌸", "💫", "🦋"];
            const rect = e.target.getBoundingClientRect();
            const merkezX = rect.left + rect.width / 2;
            const merkezY = rect.top + rect.height / 2;

            for (let i = 0; i < 12; i++) {
                const span = document.createElement("span");
                span.className = "sparkle";
                span.innerText = ikonlar[Math.floor(Math.random() * ikonlar.length)];
                
                const tx = (Math.random() - 0.5) * 260 + "px";
                const ty = (Math.random() - 0.8) * 240 + "px";
                
                span.style.left = merkezX + "px";
                span.style.top = merkezY + "px";
                span.style.setProperty("--tx", tx);
                span.style.setProperty("--ty", ty);

                document.body.appendChild(span);
                setTimeout(() => span.remove(), 1400);
            }
        }
    </script>

</body>
</html>
